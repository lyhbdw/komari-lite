name: Build frontend theme
description: Build the bundled lite frontend from frontend/ and optionally upload it as an artifact.

inputs:
  node-version:
    description: Node.js version used to build the bundled frontend.
    default: "23"

  artifact-name:
    description: Optional artifact name for the packed frontend theme.
    default: ""

runs:
  using: composite
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: ${{ inputs.node-version }}

    - name: Install zstd
      shell: bash
      run: |
        set -euxo pipefail
        if ! command -v zstd >/dev/null 2>&1; then
          sudo apt-get update
          sudo apt-get install -y zstd
        fi

    - name: Build theme (visitor UI)
      shell: bash
      run: |
        set -euxo pipefail
        cd theme
        npm ci
        npm run build
        cd ..

        mkdir -p web/public/defaultTheme
        rm -rf web/public/defaultTheme/dist web/public/defaultTheme/dist.tar.zst
        test -f theme/dist/index.html
        tar -cf "$RUNNER_TEMP/komari-theme-dist.tar" -C theme/dist .
        zstd -19 -T0 -q -f "$RUNNER_TEMP/komari-theme-dist.tar" -o web/public/defaultTheme/dist.tar.zst
        rm -f "$RUNNER_TEMP/komari-theme-dist.tar"
        cp -f theme/komari-theme.json web/public/defaultTheme/

    - name: Build admin frontend
      shell: bash
      run: |
        set -euxo pipefail
        cd frontend
        npm ci
        npm run build
        cd ..

        rm -rf web/public/defaultTheme/admin-dist.tar.zst
        test -f frontend/dist/index.html
        tar -cf "$RUNNER_TEMP/komari-admin-dist.tar" -C frontend/dist .
        zstd -19 -T0 -q -f "$RUNNER_TEMP/komari-admin-dist.tar" -o web/public/defaultTheme/admin-dist.tar.zst
        rm -f "$RUNNER_TEMP/komari-admin-dist.tar"

    - name: Pack frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      shell: bash
      run: |
        set -euxo pipefail
        tar -czf "$RUNNER_TEMP/${{ inputs.artifact-name }}.tar.gz" -C web/public/defaultTheme .

    - name: Upload frontend artifact
      if: ${{ inputs.artifact-name != '' }}
      uses: actions/upload-artifact@v4
      with:
        name: ${{ inputs.artifact-name }}
        path: ${{ runner.temp }}/${{ inputs.artifact-name }}.tar.gz
