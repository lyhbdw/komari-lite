<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" fill="none">
  <style>
    :root {
      --icon-color: #27272a;
    }
    @media (prefers-color-scheme: dark) {
      :root {
        --icon-color: #f4f4f5;
      }
    }
    .kml-stroke {
      stroke: var(--icon-color);
    }
    .kml-fill {
      fill: var(--icon-color);
    }
  </style>
  <!-- Transparent background, thicker terminal frame -->
  <rect class="kml-stroke" x="36" y="36" width="440" height="440" rx="96" stroke-width="40" fill="none"/>
  
  <!-- Prompt > -->
  <path class="kml-stroke" d="M 148 168 L 246 256 L 148 344" stroke-width="46" stroke-linecap="round" stroke-linejoin="round"/>
  
  <!-- Cursor _ -->
  <rect class="kml-fill" x="276" y="322" width="112" height="44" rx="12"/>
</svg>
