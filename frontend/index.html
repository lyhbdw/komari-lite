<!DOCTYPE html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <link rel="shortcut icon" href="favicon.ico" type="image/x-icon" />
    <meta name="description" content="A simple server monitor tool." />
    <meta
      name="keywords"
      content="server monitor, Komari Monitor, server uptime monitoring, real-time server status, server performance dashboard, monitoring tool"
    />
    <meta name="author" content="Akizon77" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script>
      (() => {
        try {
          const stored = localStorage.getItem("themeMode");
          const mode = (stored === "light" || stored === "dark" || stored === "auto") ? stored : "auto";
          const prefersDark = window.matchMedia?.("(prefers-color-scheme: dark)").matches;
          const isDark = mode === "dark" || (mode === "auto" && prefersDark);
          document.documentElement.classList.toggle("dark", isDark);
        } catch {
          document.documentElement.classList.remove("dark");
        }
      })();
    </script>
    <style>
      :where(html) {
        background: #f6f4ee;
        color-scheme: light;
      }

      :where(html.dark) {
        background: #121110;
        color-scheme: dark;
      }

      html,
      body,
      #root {
        min-height: 100%;
      }

      body {
        margin: 0;
        background: #f6f4ee;
      }

      html.dark body {
        background: #121110;
      }
    </style>
    
    <link rel="apple-touch-icon" href="/favicon.ico" />
    <link rel="icon" type="image/png" sizes="192x192" href="/favicon.ico" />
    
    <meta property="og:title" content="Komari Monitor" />
    <meta property="og:description" content="A simple server monitor tool." />
    <!-- <meta property="og:image" content="/images/komari-preview.png" /> -->
    <meta name="twitter:card" content="summary_large_image" />
    <meta name="twitter:title" content="Komari Monitor" />
    <meta name="twitter:description" content="A simple server monitor tool." />
    <!-- <meta name="twitter:image" content="/images/komari-preview.png" /> -->
    <title>Komari Monitor</title>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
